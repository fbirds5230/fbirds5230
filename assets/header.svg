<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" fill="none" role="img" aria-labelledby="title description">
  <title id="title">fbirds5230 — Small fixes. Fewer surprises.</title>
  <desc id="description">A purple pixel bird floats inside an orbital ring beside large lettering on a midnight-blue background. The animation pauses when reduced motion is preferred.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111126"/>
      <stop offset="1" stop-color="#090D1B"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(1015 205) rotate(90) scale(310 370)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity=".25"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="64" y1="0" x2="1220" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset=".65" stop-color="#B6A0FF"/>
      <stop offset="1" stop-color="#6DE1DF"/>
    </linearGradient>
    <linearGradient id="body" x1="936" y1="133" x2="1080" y2="302" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C7A5FF"/>
      <stop offset=".54" stop-color="#A274ED"/>
      <stop offset="1" stop-color="#734BC1"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="428" rx="28"/></clipPath>
  </defs>
  <style>
    .bird { animation: float 6s ease-in-out infinite; }
    .spark { animation: shimmer 5s ease-in-out infinite; }
    .spark-late { animation-delay: -2.5s; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes shimmer { 0%, 100% { opacity: .35; } 50% { opacity: .85; } }
    @media (prefers-reduced-motion: reduce) { .bird, .spark { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1280" height="430" fill="url(#background)"/>
    <rect width="1280" height="430" fill="url(#halo)"/>
    <path d="M58 1H1222" stroke="url(#accent)" stroke-width="4"/>
    <path d="M735 0V430M0 368H1280" stroke="#C4B5FD" stroke-opacity=".07"/>
    <path d="M64 70H94" stroke="#6DE1DF" stroke-width="3" stroke-linecap="round"/>
    <text x="110" y="77" fill="#B9A9E9" font-family="'DejaVu Sans Mono', monospace" font-size="19" font-weight="500" letter-spacing="3">OPEN SOURCE / PERSONAL SPACE</text>
    <text x="63" y="182" fill="#F5F1FF" font-family="'DejaVu Sans', Arial, sans-serif" font-size="88" font-weight="700" letter-spacing="-5">fbirds5230</text>
    <text x="68" y="255" fill="#F0EBFF" font-family="'DejaVu Sans', Arial, sans-serif" font-size="46" font-weight="500" letter-spacing="-1">Small fixes.</text>
    <text x="68" y="313" fill="#BCA5FF" font-family="'DejaVu Sans', Arial, sans-serif" font-size="46" font-weight="500" letter-spacing="-1">Fewer surprises.</text>
    <text x="68" y="405" fill="#9D9AAF" font-family="'DejaVu Sans Mono', monospace" font-size="19" letter-spacing=".2">reproduce / understand / fix / test</text>
    <text x="1020" y="405" fill="#6DE1DF" font-family="'DejaVu Sans Mono', monospace" font-size="19" letter-spacing="2">KEEP CURIOUS.</text>
    <circle cx="1008" cy="203" r="145" stroke="#A78BFA" stroke-opacity=".13"/>
    <circle cx="1008" cy="203" r="167" stroke="#A78BFA" stroke-opacity=".07" stroke-dasharray="3 11"/>
    <ellipse cx="1008" cy="219" rx="206" ry="75" transform="rotate(-22 1008 219)" stroke="#A78BFA" stroke-opacity=".26" stroke-width="1.5"/>
    <path d="M800 189V154H832M1180 245V280H1148" stroke="#6DE1DF" stroke-opacity=".6" stroke-width="2"/>
    <path class="spark" d="M849 103V119M841 111H857" stroke="#6DE1DF" stroke-width="2" stroke-linecap="round"/>
    <path class="spark spark-late" d="M1158 102V118M1150 110H1166" stroke="#C7A5FF" stroke-width="2" stroke-linecap="round"/>
    <path class="spark" d="M1152 316V328M1146 322H1158" stroke="#6DE1DF" stroke-width="2" stroke-linecap="round"/>
    <rect x="866" y="309" width="5" height="5" rx="1" fill="#C7A5FF" fill-opacity=".45"/>
    <rect x="1086" y="64" width="4" height="4" rx="1" fill="#6DE1DF" fill-opacity=".6"/>
    <g class="bird">
      <path d="M929 187H912V202H895V236H912V254H941V208Z" fill="#7851C5"/>
      <path d="M1087 187H1104V202H1121V236H1104V254H1075V208Z" fill="#7851C5"/>
      <path d="M932 155V112H949V127H965V144H1051V127H1067V112H1084V155H1100V172H1111V260H1095V279H1075V297H941V279H921V260H905V172H916V155Z" fill="#39265F"/>
