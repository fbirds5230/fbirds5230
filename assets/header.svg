      <path d="M965 255V261H976V267H987V261H998M1018 261H1029V267H1040V261H1051V255" stroke="#D2B8FF" stroke-opacity=".55" stroke-width="5"/>
      <path d="M955 291V302H979V291M1037 291V302H1061V291" fill="#FFB685"/>
    </g>
    <rect x="872" y="326" width="272" height="28" rx="14" fill="#16192F" stroke="#3C345A"/>
    <text x="1008" y="345" fill="#B8A7DC" font-family="'DejaVu Sans Mono', monospace" font-size="15" text-anchor="middle" letter-spacing="1">less noise. better code.</text>
  </g>
  <rect x="1" y="1" width="1278" height="428" rx="28" stroke="#3B3157" stroke-width="2"/>
</svg>
