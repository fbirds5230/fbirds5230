      <path d="M946 274H1070V291H946Z" fill="#6941AF"/>
      <path d="M943 158H971V168H943ZM1045 158H1073V168H1045Z" fill="#DECAFF" fill-opacity=".55"/>
      <rect x="931" y="177" width="61" height="61" rx="20" fill="#E6D7FF"/>
      <rect x="1024" y="177" width="61" height="61" rx="20" fill="#E6D7FF"/>
      <rect x="945" y="188" width="39" height="43" rx="13" fill="#151329"/>
      <rect x="1032" y="188" width="39" height="43" rx="13" fill="#151329"/>
      <rect x="950" y="191" width="12" height="12" rx="4" fill="#F7F3FF"/>
      <rect x="1037" y="191" width="12" height="12" rx="4" fill="#F7F3FF"/>
      <rect x="972" y="215" width="6" height="6" rx="2" fill="#6DE1DF"/>
      <rect x="1059" y="215" width="6" height="6" rx="2" fill="#6DE1DF"/>
